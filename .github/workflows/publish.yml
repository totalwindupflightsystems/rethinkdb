name: "Publish Docker image"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # RT-CI-001 root cause: pushes to ghcr.io/totalwindupflightsystems/rethinkdb
      # failed with 'ERROR: failed to build: failed to solve: failed to push
      # ghcr.io/totalwindupflightsystems/rethinkdb:latest: denied: permission_denied:
      # read_package' because the package in that namespace is a USER-scoped,
      # private, repo-UNLINKED package (created 2026-08-10 by a manual PAT push
      # during RT-GAP-010, before this workflow existed) — the repo GITHUB_TOKEN
      # cannot read it, so buildx push is denied even though the multi-arch build
      # succeeds (proven: the build completes for both platforms in ~2h before the
      # push step fails; CI runs 33346331718 and 33360124574).
      #
      # GitHub REST has REMOVED every API remediation (re-checked twice, most
      # recently 2026-09-01): PATCH-visibility and repo-link endpoints 404 (absent
      # from the api.github.com spec + docs), and no token has delete:packages —
      # the stale package cannot be re-scoped, linked, or deleted via API.
      # Package visibility/linking is UI-only (package settings page).
      #
      # Fix that works TODAY (proven 2026-08-31 local test push): authenticate the
      # push as the package OWNER with a classic PAT (write:packages, stored as the
      # GHCR_PAT repo secret). A PAT push authenticates as the USER, not the repo,
      # so it has full R/W access to the user's own packages regardless of repo
      # linking or visibility. Keep GITHUB_TOKEN as the fallback for the day the
      # package gets linked+public via the UI (then `secrets.GHCR_PAT || secrets.`…
      # …GITHUB_TOKEN` still resolves correctly and a green run with the repo token
      # can be verified).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/totalwindupflightsystems/rethinkdb"
          TAGS="${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/}"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
