name: "Publish Docker image"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # RT-CI-001 root cause: pushes to ghcr.io/totalwindupflightsystems/rethinkdb
      # failed with 'ERROR: failed to build: failed to solve: failed to push
      # ghcr.io/totalwindupflightsystems/rethinkdb:latest: denied: permission_denied:
      # read_package' because the package already existing in that namespace was a
      # USER-scoped, private, repo-UNLINKED package (created 2026-08-10 by a manual
      # PAT push during RT-GAP-010, before this workflow existed) — the repo
      # GITHUB_TOKEN cannot read it, so buildx push was denied even though the
      # multi-arch build succeeds. Remediation (external state, RT-CI-001):
      # RE-CHECKED 2026-08-31: PATCH-visibility + repo-link REST endpoints are GONE
      # from the current GitHub API (404; absent from api.github.com spec + docs)
      # and no token has delete:packages — the stale package cannot be re-scoped or
      # deleted via API. Required one-time step in package settings UI (github.com/
      # users/totalwindupflightsystems/packages/container/rethinkdb/settings): link
      # this repo (Manage Actions access) and set visibility public — then the next
      # workflow push succeeds with the repo GITHUB_TOKEN.
      # Authenticate with the built-in GITHUB_TOKEN only (repo scoped,
      # expires with the run) — no long-lived credentials are stored.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/totalwindupflightsystems/rethinkdb"
          TAGS="${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/}"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
