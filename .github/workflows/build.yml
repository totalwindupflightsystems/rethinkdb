name: "Build"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  # ── Build & Unit Tests (gcc-15 on ubuntu-26.04) ──
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            protobuf-compiler \
            python3 \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libncurses5-dev \
            libjemalloc-dev \
            wget \
            m4 \
            g++-15 \
            libssl-dev

      - name: Configure
        run: ./configure --allow-fetch CXX=g++-15 CC=gcc-15

      - name: Build
        run: make -j$(nproc)

      - name: Unit tests
        run: ./build/release/rethinkdb-unittest
