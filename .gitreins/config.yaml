# GitReins Pipeline Config — RethinkDB (C++ Project)
# Three-tier quality harness:
#   Tier 1: Static guards (secrets, lint, tests, build)
#   Tier 2: LLM agentic evaluator (DeepSeek V4 Flash)
#   Tier 3: C++ deep static analysis (cppcheck + clang-tidy)

guards:
  secrets: true
  lint: true
  lint_command: ./scripts/check_style.sh
  tests: true
  test_mode: diff
  test_command: ./build/release/rethinkdb-unittest
  test_timeout: 300

# ── Pipeline Stages ──
pipeline:
  stages:
    # Stage 1: Parallel static checks (pre-commit + pre-eval)
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: secrets
          type: script
          run: "gitleaks detect --config .gitleaks.toml --no-git"
          on_fail: block

        - id: lint
          type: script
          run: "./scripts/check_style.sh"
          on_fail: block

        - id: build
          type: script
          run: "make -j4"
          on_fail: block

        - id: tests
          type: script
          run: "./build/release/rethinkdb-unittest --gtest_filter='*Cdc*:*Vector*:*Fts*:*Brin*:*Sindex*:*Term*:*Btree*:*Reql*'"
          on_fail: block

    # Stage 2: AI evaluation (LLM judges work against criteria)
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: 100
      # 8M: raised from 2M (tick 194) — evaluator exploration of this large C++
      # repo repeatedly hit "Input token budget (2.0M) exceeded" mid-eval,
      # forcing every tier2 verdict to INCOMPLETE. Defaults block allows 16M.
      max_input_tokens: "8M"
      tools: [read_file, run_command, search_pattern, read_diff, sandbox]

    # Stage 3: C++ deep static analysis (post-commit, informational)
    - id: tier3
      parallel: true
      on: [pre-eval]
      steps:
        - id: cppcheck
          type: script
          run: |
            echo "=== cppcheck static analysis ==="
            cppcheck --enable=warning,performance,portability,style --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=noExplicitConstructor --inline-suppr --error-exitcode=0 -j4 src/ 2>&1 | head -100
            echo "cppcheck done (informational only)"
          on_fail: continue

        - id: clang-tidy
          type: script
          timeout: 300
          run: |
            echo "=== clang-tidy static analysis ==="
            CLANG_TIDY=$(which clang-tidy-21 clang-tidy 2>/dev/null | head -1)
            if [ -z "$CLANG_TIDY" ]; then
              echo "clang-tidy not found — skipping"
            elif [ -f compile_commands.json ]; then
              find src/ -name '*.cc' | head -20 | xargs -P2 -I{} timeout 60 "$CLANG_TIDY" {} -p . -checks='-*,bugprone-*,performance-*,modernize-use-nullptr,modernize-use-override' -quiet 2>&1 | head -100
            else
              echo "No compile_commands.json — install bear and run: bear -- make -j4"
            fi
            echo "clang-tidy done (informational only)"
          on_fail: continue

# ── Evaluator Caps (v0.3.0+) ──
evaluator:
  max_iterations: 100
  max_time: 30m
  max_input_tokens: 16M
  max_output_tokens: 4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
