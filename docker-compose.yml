# RethinkDB fork — single-node quickstart.
#
#   docker compose up -d   # builds the image from source and starts the server
#
# The image is built from source via `build: .` — there is no public prebuilt
# image. The ghcr.io/totalwindupflightsystems/rethinkdb:latest package is
# private (anonymous pulls are denied) and CI has no publish workflow, so
# compose always builds locally and never pulls. Maintainers who want a
# registry copy must tag and push manually with registry auth.

services:
  rethinkdb:
    build: .
    container_name: rethinkdb
    ports:
      - "28015:28015"   # driver port (ReQL clients)
      - "8080:8080"     # web UI
    volumes:
      - rethinkdb-data:/data
    restart: unless-stopped

volumes:
  rethinkdb-data:
