# RethinkDB fork — single-node quickstart.
#
#   docker compose up -d   # pulls the prebuilt image, or builds from source
#
# The prebuilt multi-arch image (linux/amd64 + linux/arm64) is published to
# ghcr.io/totalwindupflightsystems/rethinkdb by CI
# (.github/workflows/publish.yml) on every push to main. When the image is
# already available, compose pulls it; when it is not (e.g. the very first run
# after a fresh checkout, before the workflow has published, or offline)
# compose falls back to building from source via `build: .` (first build
# ~8-10 min on a 16-core host).
#
# The server binds the driver and web UI beyond loopback, so it refuses to
# boot without an admin password. RETHINKDB_PASSWORD (default `rethinkdb` —
# override with a `.env` file or an exported shell variable) is passed to the
# container, which hands it to the server as --initial-password.

services:
  rethinkdb:
    image: ghcr.io/totalwindupflightsystems/rethinkdb:latest
    build: .
    container_name: rethinkdb
    environment:
      RETHINKDB_PASSWORD: ${RETHINKDB_PASSWORD:-rethinkdb}
    ports:
      - "28015:28015"   # driver port (ReQL clients)
      - "8080:8080"     # web UI
    volumes:
      - rethinkdb-data:/data
    restart: unless-stopped

volumes:
  rethinkdb-data:
