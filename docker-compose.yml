# RethinkDB fork — single-node quickstart.
#
#   docker compose up -d --build   # build the image from source locally
#
# The prebuilt image at ghcr.io/totalwindupflightsystems/rethinkdb:latest is
# currently PRIVATE — anonymous pulls fail and compose does NOT fall back to
# building from source. Use `--build` unless you have registry auth
# (maintainers: docker compose pull / up -d without --build).

services:
  rethinkdb:
    image: ghcr.io/totalwindupflightsystems/rethinkdb:latest
    build: .
    container_name: rethinkdb
    ports:
      - "28015:28015"   # driver port (ReQL clients)
      - "8080:8080"     # web UI
    volumes:
      - rethinkdb-data:/data
    restart: unless-stopped

volumes:
  rethinkdb-data:
